server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /practices-service/;
    }

    # Files with a hash in the name never change.
    location /practices-service/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other address belongs to the router of the application.
    location /practices-service/ {
        add_header Cache-Control "no-cache";
        try_files $uri /practices-service/index.html;
    }
}

services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-practices-service
    ports:
      - "127.0.0.1:15672:15672"
    expose:
      - "5672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - proxybackend

  gateway.api:
    image: ${DOCKER_REGISTRY-}gatewayapi
    container_name: gateway.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
    build:
      context: .
      dockerfile: Gateway/Gateway.Api/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:8080"
    networks:
      - proxybackend

  core.db:
    image: postgres:14.5-alpine
    container_name: core.db
    volumes:
      - ./Services/CoreService.Api/init-db/:/docker-entrypoint-initdb.d
      - ./Services/CoreService.Api/pg-data:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in .env}
      - POSTGRES_DB=postgres
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U postgres"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5
    networks:
      - proxybackend
        
  audit.api:
    container_name: audit.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - MongoSettings__ConnectionString=mongodb://${MONGO_USER:?Set MONGO_USER in .env}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@practice-entities.db:27017/admin
      - MongoSettings__DatabaseName=audit_db
    build:
      context: .
      dockerfile: Services/AuditService.Api/Dockerfile
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - proxybackend

  core.api:
    container_name: core.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ENVIRONMENT=Docker
      - ConnectionStrings__Docker=Server=core.db;Database=postgres;Username=postgres;Password=${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in .env}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Services/CoreService.Api/Dockerfile
    volumes:
      - ./Services/CoreService.Api:/src
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      # core.db:
      #   condition: service_healthy
    networks:
      - proxybackend

  auth.db:
    image: postgres:14.5-alpine
    container_name: auth.db
    volumes:
      - ./Services/AuthService.Api/pg-data:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxybackend

  auth.api:
    container_name: auth.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ENVIRONMENT=Docker
      - RUN_MIGRATIONS=true
      - ConnectionStrings__Docker=Server=auth.db;Database=postgres;Username=postgres;Password=${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Services/AuthService.Api/Dockerfile
    volumes:
      - ./Services/AuthService.Api:/src
    expose:
      - "8080"
    depends_on:
      auth.db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - proxybackend
      
  practice-entities.api:
    container_name: practice-entities.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ENVIRONMENT=Docker
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - MongoSettings__ConnectionString=mongodb://${MONGO_USER:?Set MONGO_USER in .env}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@practice-entities.db:27017/admin
      - S3Storage__ServiceURL=${S3_SERVICE_URL:-}
      - S3Storage__AccessKey=${S3_ACCESS_KEY:-}
      - S3Storage__SecretKey=${S3_SECRET_KEY:-}
      - S3Storage__BucketName=${S3_BUCKET_NAME:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Services/PracticeEntitiesService.Api/Dockerfile
    volumes:
      - ./Services/PracticeEntitiesService.Api:/src
    expose:
      - "8080"
    depends_on:
      auth.db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - proxybackend
  
  llm.api:
    container_name: llm.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - LLMSettings__ApiKey=${LLM_API_KEY}
    build:
      context: .
      dockerfile: Services/LlmService.Api/Dockerfile
    expose:
      - "8080"
    ports:
      - "127.0.0.1:5005:8080"
    networks:
      - proxybackend
    restart: unless-stopped

  practice-entities.db:
    image: mongo:6.0
    container_name: practice-entities.db
    expose:
      - "27017"
    volumes:
      - ./mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:?Set MONGO_USER in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    networks:
      - proxybackend
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      
  notification.api:
    container_name: notification.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ENVIRONMENT=Docker
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - SmtpSettings__Username=${SMTP_USERNAME:-}
      - SmtpSettings__Password=${SMTP_PASSWORD:-}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL:-}
      - SmtpSettings__FromName=${SMTP_FROM_NAME:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Services/NotificationService.Api/Dockerfile
    volumes:
      - ./Services/NotificationService.Api:/src
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - proxybackend
  
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    networks:
      - proxybackend

volumes:
  frontend_node_modules:

networks:
  proxybackend:
    driver: bridge

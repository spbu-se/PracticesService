services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-practices-service
    ports:
      - "127.0.0.1:15672:15672"
    expose:
      - "5672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - proxybackend

  gateway.api:
    image: ${DOCKER_REGISTRY-}gatewayapi
    container_name: gateway.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
    build:
      context: .
      dockerfile: Gateway/Gateway.Api/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:8080"
    networks:
      - proxybackend

  core.db:
    image: postgres:14.5-alpine
    container_name: core.db
    volumes:
      - ./Services/CoreService.Api/init-db/:/docker-entrypoint-initdb.d
      - ./Services/CoreService.Api/pg-data:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U postgres"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5
    networks:
      - proxybackend

  core.api:
    container_name: core.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ENVIRONMENT=Docker
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Services/CoreService.Api/Dockerfile
    volumes:
      - ./Services/CoreService.Api:/src
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      # core.db:
      #   condition: service_healthy
    networks:
      - proxybackend

  auth.db:
    image: postgres:14.5-alpine
    container_name: auth.db
    volumes:
      - ./Services/AuthService.Api/pg-data:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxybackend

  auth.api:
    container_name: auth.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ENVIRONMENT=Docker
      - RUN_MIGRATIONS=true
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Services/AuthService.Api/Dockerfile
    volumes:
      - ./Services/AuthService.Api:/src
    expose:
      - "8080"
    depends_on:
      auth.db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - proxybackend
      
  practice-entities.api:
    container_name: practice-entities.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ENVIRONMENT=Docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Services/PracticeEntitiesService.Api/Dockerfile
    volumes:
      - ./Services/PracticeEntitiesService.Api:/src
    expose:
      - "8080"
    depends_on:
      auth.db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - proxybackend
        
  practice-entities.db:
    image: mongo:6.0
    container_name: practice-entities.db
    expose:
      - "27017"
    volumes:
      - ./mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    networks:
      - proxybackend
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - HMR_HOST=0.0.0.0
      - HMR_PORT=8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    stdin_open: true
    tty: true
    networks:
      - proxybackend

networks:
  proxybackend:
    driver: bridge
